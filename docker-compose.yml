# Builds the image and runs the proxy — all with `docker compose up --build`.
# Configuration comes only from environment values (see .env.example).
# No volumes, no config files: copy .env, then `docker compose up -d`.
services:
  owui_agents:
    build: .
    image: owui_agents
    env_file: .env
    environment:
      # Forward PORT into the container so mapping and listener stay in sync.
      # PORT is required: set it in .env (see .env.example) or in the shell.
      PORT: ${PORT}
    ports:
      - "${PORT}:${PORT}"
    restart: unless-stopped
