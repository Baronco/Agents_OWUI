[project]
name = "agents-owui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "uvicorn>=0.49.0",
    "python-socketio[client]>=5.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # required by fastapi.testclient.TestClient (concurrency tests)
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "D",     # pydocstyle
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # Ruff-specific rules
]
ignore = [
    "D100",  # Permitir módulos sin docstring (opcional)
    "D104",  # Permitir paquetes sin docstring (opcional)
]

[tool.ruff.lint.per-file-ignores]
# Ported verbatim from GenFilesMCP (spec 015) — do not modify. Excluded from lint.
"tools/*.py" = ["E", "W", "F", "I", "N", "D", "UP", "B", "C4", "SIM", "TCH", "RUF"]
"utils/**/*.py" = ["E", "W", "F", "I", "N", "D", "UP", "B", "C4", "SIM", "TCH", "RUF"]
# Tests follow the existing repo convention (no per-function docstrings).
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
